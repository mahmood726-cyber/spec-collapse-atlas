name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pytest
      - run: python -m pytest -q
        # fragility-atlas (used by one optional test) is absent in CI; that test skips.

  metafor-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install R deps
        run: Rscript -e 'install.packages(c("metafor","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Compute metafor reference
        run: Rscript ci/metafor_reference.R
      - name: Assert engine matches metafor
        run: python ci/check_against_metafor.py
